services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://avm:avm@postgres:5432/avm
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_3D_TILES_ENABLED: ${GOOGLE_3D_TILES_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: avm
      POSTGRES_USER: avm
      POSTGRES_PASSWORD: avm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avm -d avm"]
      interval: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: {pgdata: {}}
