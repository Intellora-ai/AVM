services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: avm
      POSTGRES_USER: avm
      POSTGRES_PASSWORD: avm
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes: {pgdata: {}}
